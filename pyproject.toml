[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shallowimagion"
version = "0.1.0"
description = "A deliberately wrong little agent. Thinks shallow, speaks full."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "liwenlin" }]
keywords = ["agent", "parody", "hallucination", "category-mistake", "small-model"]
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.51",
  "peft>=0.14",
  "accelerate>=0.34",
]
dev = ["pytest>=8"]

[project.scripts]
shallowimagion = "harness.cli:main"

[tool.setuptools]
packages = ["harness"]
